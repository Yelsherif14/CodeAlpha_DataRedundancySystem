<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Data Redundancy Removal System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        input {
            padding: 8px;
            width: 300px;
        }

        button {
            padding: 9px 20px;
            cursor: pointer;
        }

        .message {
            padding: 10px;
            margin: 20px 0;
        }

        .success {
            background: #d4edda;
        }

        .error {
            background: #f8d7da;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
    </style>
</head>

<body>

    <h1>Data Redundancy Removal System</h1>

    <p>
        Add user data below. The system will validate the data
        and prevent duplicate email addresses.
    </p>

    <form method="POST">

        <label for="name">Name:</label>
        <br>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter name"
            required
        >

        <br><br>

        <label for="email">Email:</label>
        <br>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter email"
            required
        >

        <br><br>

        <button type="submit">
            Add Data
        </button>

    </form>


    {% if message %}

        <div class="message {{ message_type }}">
            {{ message }}
        </div>

    {% endif %}


    <h2>Stored Data</h2>

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
        </tr>

        {% for user in users %}

        <tr>
            <td>{{ user["id"] }}</td>
            <td>{{ user["name"] }}</td>
            <td>{{ user["email"] }}</td>
        </tr>

        {% endfor %}

    </table>

</body>

</html>
